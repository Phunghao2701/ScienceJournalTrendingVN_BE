version: '3.8'

services:
  backend:
    image: ghcr.io/leduycoder/scientificjournalsystem-be:latest
    container_name: researchpulse_backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    networks:
      - researchpulse_network

networks:
  researchpulse_network:
    external: true
    name: researchpulse_network